spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/mindconnectdb
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo crea Flyway, Hibernate no toca nada
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": mindconnect_schema
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    init-sqls:
      - CREATE SCHEMA IF NOT EXISTS mindconnect_schema
    schemas:
      - mindconnect_schema
    default-schema: mindconnect_schema
    table: flyway_schema_history_mindconnect
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      db_schema: mindconnect_schema

server:
  port: 8082

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
